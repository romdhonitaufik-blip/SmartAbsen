<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAbsen - PT ANUGERAH BERKAH INDUSTRI</title>

  <!-- Tailwind CSS Configuration & CDN -->
  <script>
    window.tailwind = {
      config: {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af'
              }
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font & Inlined Complete Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0ea5e9;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Glassmorphism effects */
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* Pulse animation for live indicators */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .pulse-dot {
      animation: pulse-ring 2s infinite cubic-bezier(0.455, 0.03, 0.515, 0.955);
    }

    /* Camera viewport styling */
    .camera-container {
      position: relative;
      overflow: hidden;
      border-radius: 1rem;
      background-color: #0f172a;
    }

    .camera-guide-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 260px;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      border-radius: 1.5rem;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    /* Print Styling for Report */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      .print-container {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        border: none !important;
        box-shadow: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }
      th, td {
        border: 1px solid #cbd5e1 !important;
        padding: 8px !important;
        font-size: 11px !important;
      }
      th {
        background-color: #f1f5f9 !important;
      }
    }
  </style>

  <!-- Canvas Confetti & html2pdf (Non-blocking defer) -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Root Application Container -->
  <div id="app-root" class="min-h-screen flex flex-col">
    <!-- Populated dynamically by app.js -->
    <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-6">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-semibold text-slate-300">Memuat Sistem SmartAbsen...</p>
      </div>
    </div>
  </div>

  <!-- Floating Toast Container -->
  <div id="toast-container"
    class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2.5 max-w-sm pointer-events-none no-print"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="no-print"></div>

  <!-- Bulletproof Universal Script Loader: otomatis mendeteksi file di Root maupun di assets/js/ -->
  <script>
    (function () {
      function loadScript(src, fallback) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = function () {
            resolve(src);
          };
          s.onerror = function () {
            if (fallback) {
              console.warn('[SmartAbsen] File ' + src + ' 404, beralih ke fallback: ' + fallback);
              var fb = document.createElement('script');
              fb.src = fallback;
              fb.onload = function () {
                resolve(fallback);
              };
              fb.onerror = function () {
                reject(new Error('Gagal memuat: ' + src + ' maupun ' + fallback));
              };
              document.body.appendChild(fb);
            } else {
              reject(new Error('Gagal memuat: ' + src));
            }
          };
          document.body.appendChild(s);
        });
      }

      // Muat dummy-data.js terlebih dahulu, kemudian app.js
      loadScript('dummy-data.js?v=20261117_v10', 'assets/js/dummy-data.js?v=20261117_v10')
        .then(function () {
          return loadScript('app.js?v=20261117_v10', 'assets/js/app.js?v=20261117_v10');
        })
        .catch(function (err) {
          console.error('[SmartAbsen Fatal]', err);
          var root = document.getElementById('app-root');
          if (root) {
            root.innerHTML = '' +
              '<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-6">' +
              '  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-rose-500/30 text-center space-y-4 shadow-2xl">' +
              '    <div class="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-xl flex items-center justify-center mx-auto">' +
              '      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
              '    </div>' +
              '    <h3 class="text-base font-bold text-white">File Script Belum Terpasang</h3>' +
              '    <p class="text-xs text-slate-300">Browser tidak dapat menemukan file <b>dummy-data.js</b> atau <b>app.js</b> di GitHub Anda.</p>' +
              '    <p class="text-[11px] text-slate-400">Pastikan file <code>dummy-data.js</code> dan <code>app.js</code> sudah di-upload ke repositori GitHub.</p>' +
              '    <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">Coba Muat Ulang</button>' +
              '  </div>' +
              '</div>';
          }
        });
    })();
  </script>
</body>

</html>
